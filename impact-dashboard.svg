<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Devesh Ojha impact snapshot: a +15.5% growth leader identified in AER filings, 3 day reporting cycle cut to 4 hours, 12 hours of manual work reduced to 90 seconds, 8 stakeholder teams on shipped dashboards, and a model benchmark chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101B30"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F6FD0"/>
      <stop offset="100%" stop-color="#4F9CF9"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18936B"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#18243C" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#223250"/>

  <!-- header -->
  <circle cx="30" cy="36" r="5" fill="#34D399"/>
  <text x="46" y="41" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF7" letter-spacing="1.6">DEVESH OJHA — IMPACT SNAPSHOT</text>
  <text x="976" y="41" text-anchor="end" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7F92AE" letter-spacing="1.2">DATA · ML · PRODUCTION SYSTEMS</text>
  <line x1="24" y1="58" x2="976" y2="58" stroke="#223250"/>

  <!-- KPI tile 1 -->
  <rect x="24" y="78" width="274" height="104" rx="10" fill="#131E33" stroke="#233553"/>
  <rect x="24" y="78" width="4" height="104" rx="2" fill="#4F9CF9"/>
  <text x="44" y="106" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8A9BB5" letter-spacing="1.3">AER FILINGS · TOP MOVER FOUND</text>
  <text x="44" y="146" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#E6EDF7">+15.5%</text>
  <text x="44" y="168" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7F92AE">Gibson bitumen output, 2022–24</text>

  <!-- KPI tile 2 -->
  <rect x="314" y="78" width="274" height="104" rx="10" fill="#131E33" stroke="#233553"/>
  <rect x="314" y="78" width="4" height="104" rx="2" fill="#34D399"/>
  <text x="334" y="106" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8A9BB5" letter-spacing="1.3">SLA REPORTING CYCLE</text>
  <text x="334" y="146" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#E6EDF7">3d <tspan fill="#34D399" font-size="24">→</tspan> 4h</text>
  <text x="334" y="168" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7F92AE">ServiceNow → ADF → Power BI</text>

  <!-- KPI tile 3 -->
  <rect x="24" y="196" width="274" height="104" rx="10" fill="#131E33" stroke="#233553"/>
  <rect x="24" y="196" width="4" height="104" rx="2" fill="#34D399"/>
  <text x="44" y="224" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8A9BB5" letter-spacing="1.3">HR CONSOLIDATION RUNTIME</text>
  <text x="44" y="264" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#E6EDF7">12h <tspan fill="#34D399" font-size="24">→</tspan> 90s</text>
  <text x="44" y="286" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7F92AE">12 validation rules · Streamlit upload</text>

  <!-- KPI tile 4 -->
  <rect x="314" y="196" width="274" height="104" rx="10" fill="#131E33" stroke="#233553"/>
  <rect x="314" y="196" width="4" height="104" rx="2" fill="#4F9CF9"/>
  <text x="334" y="224" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8A9BB5" letter-spacing="1.3">TEAMS ON SHIPPED DASHBOARDS</text>
  <text x="334" y="264" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#E6EDF7">8</text>
  <text x="334" y="286" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7F92AE">stakeholder teams, enterprise ITSM</text>

  <!-- chart panel -->
  <rect x="604" y="78" width="372" height="222" rx="10" fill="#131E33" stroke="#233553"/>
  <text x="624" y="106" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8A9BB5" letter-spacing="1.3">MODEL BENCHMARK · TEST ACCURACY</text>
  <text x="624" y="124" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#5E7292">Space-object classification · 33,724 rows after SMOTE</text>

  <!-- row 1 -->
  <text x="624" y="156" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#B9C7DC">Logistic Reg.</text>
  <rect x="730" y="145" width="180" height="13" rx="6.5" fill="#1C2942"/>
  <rect x="730" y="145" width="125" height="13" rx="6.5" fill="url(#barA)"/>
  <text x="918" y="156" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B9C7DC">69.3%</text>

  <!-- row 2 -->
  <text x="624" y="196" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#B9C7DC">SVM linear</text>
  <rect x="730" y="185" width="180" height="13" rx="6.5" fill="#1C2942"/>
  <rect x="730" y="185" width="134" height="13" rx="6.5" fill="url(#barA)"/>
  <text x="918" y="196" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B9C7DC">74.6%</text>

  <!-- row 3 -->
  <text x="624" y="236" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#B9C7DC">SVM RBF</text>
  <rect x="730" y="225" width="180" height="13" rx="6.5" fill="#1C2942"/>
  <rect x="730" y="225" width="167" height="13" rx="6.5" fill="url(#barA)"/>
  <text x="918" y="236" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#B9C7DC">92.7%</text>

  <!-- row 4 -->
  <text x="624" y="276" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#E6EDF7">Random Forest</text>
  <rect x="730" y="265" width="180" height="13" rx="6.5" fill="#1C2942"/>
  <rect x="730" y="265" width="175" height="13" rx="6.5" fill="url(#barB)"/>
  <text x="918" y="276" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#34D399">97.4%</text>
</svg>
